- code: broad_asset_exclusion
  message: A broad excluded asset family cannot be converted to a complete host list
    deterministically and requires review.
  source_text: '- Qualquer sistema, domínio, subdomínio, API ou serviço pertencente
    ou operado pela empresa ASAP'
- code: physical_or_totem_asset_exclusion
  message: Totem-related systems are broadly excluded and require a reviewed asset
    mapping before executable scope can be compiled.
  source_text: '- Sistemas, aplicações, APIs, equipamentos e serviços relacionados
    aos totens utilizados nas academias Smart Fit'
- code: qualitative_rate_limit
  message: Program restricts high-traffic automation but does not provide a numeric
    requests-per-second limit. A numeric execution limit must be reviewed.
  source_text: '- Uso de ferramentas automatizadas que podem gerar tráfego significativo
    é proibido.'
